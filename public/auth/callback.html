<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Signing you in…</title></head>
  <body>
    <p style="padding:16px">Signing you in…</p>
    <script>
      (function () {
        const q = new URLSearchParams(window.location.search);
        const token = q.get('token');
        const next = q.get('next') || '/home';
        if (!token) { window.location.replace('/'); return; }

        function decodeJwtExp(t) {
          try {
            const p = t.split('.')[1];
            const json = atob(p.replace(/-/g,'+').replace(/_/g,'/'));
            const o = JSON.parse(decodeURIComponent(escape(json)));
            return typeof o.exp === 'number' ? o.exp : null;
          } catch { return null; }
        }

        const now = Math.floor(Date.now()/1000);
        const exp = decodeJwtExp(token) || (now + 7*24*60*60);
        const iso = new Date(exp*1000).toISOString();
        const secure = window.location.protocol === 'https:';
        const attrs = '; Path=/; SameSite=Lax; Max-Age=604800' + (secure ? '; Secure' : '');

        document.cookie = 'token=' + token + attrs;
        document.cookie = 'auth_token=' + token + attrs;

        localStorage.setItem('token', token);
        localStorage.setItem('isAuthenticated', String(exp > now));
        localStorage.setItem('sessionExpiry', iso);
        // Optionally fetch your API to populate user and userData:
        // const API = '<YOUR_API_BASE_URL>';
        // fetch(API + '/auth/data', { headers: { Authorization: 'Bearer ' + token }})
        //   .then(r => r.ok ? r.json() : null)
        //   .then(j => {
        //     const user = j?.user || {};
        //     localStorage.setItem('user', JSON.stringify(user));
        //     localStorage.setItem('userData', JSON.stringify(user));
        //     window.location.replace(next);
        //   })
        //   .catch(() => window.location.replace(next));
        window.location.replace(next);
      })();
    </script>
  </body>
</html>
